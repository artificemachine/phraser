name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  layer1-dependency-audit:
    name: L1 Dependency Risk
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-27
      - name: Install audit tools
        run: cargo install cargo-audit --locked
      - name: Bun audit
        run: bun audit --production
      - name: Cargo audit
        working-directory: src-tauri
        run: cargo audit

  layer2-secrets:
    name: L2 Secrets
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org accounts.
      # Run the open-source gitleaks CLI directly instead — no license needed.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Gitleaks
        run: gitleaks detect --source . -v --redact

  layer3-sast:
    name: L3 SAST
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-27
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev
      # transcribe-rs enables whisper-rs's "vulkan" feature unconditionally on
      # Linux, so whisper-rs-sys runs cmake find_package(Vulkan). Without the SDK
      # the build script panics with "Could NOT find Vulkan" and clippy never runs.
      # Mirrors the working "Prepare Vulkan SDK for Ubuntu 24.04" step in build.yml.
      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt update
          sudo apt install vulkan-sdk -y
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Frontend lint
        run: bun run lint
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  layer4-human-review:
    name: L4 Human/AI Review Reminder
    runs-on: ubuntu-24.04
    steps:
      - name: Reminder
        run: |
          echo "Review security-sensitive changes manually (settings, commands, tauri config, updater/network paths)."

  layer5-runtime-checks:
    name: L5 Runtime Checks Reminder
    runs-on: ubuntu-24.04
    steps:
      - name: Reminder
        run: |
          echo "Run Playwright/runtime checks when user-facing command behavior changes."

  layer6-supply-chain:
    name: L6 Supply Chain Integrity
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: latest
      - name: Lockfile-enforced install
        run: bun install --frozen-lockfile
      - name: Ensure lockfiles unchanged
        run: |
          git diff --exit-code -- bun.lock src-tauri/Cargo.lock

  layer7-observability:
    name: L7 Observability Reminder
    runs-on: ubuntu-24.04
    steps:
      - name: Reminder
        run: |
          echo "Attach security evidence to PRs (audit outputs, key findings, remediation notes)."
